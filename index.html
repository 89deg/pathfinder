  cwd.forEach((s,i) => {
    crumbs += '<div class="link crumb" data-act="rnav" data-segs="'+A(cwd.slice(0,i+1).join('/'))+'" style="display:flex;align-items:center;gap:2px;flex-shrink:0"><div style="font-size:13px;color:#1B1B1B;padding:3px 6px;border-radius:3px;white-space:nowrap">'+E(s)+'</div>'+icon('caretRight','#A6A6A6',10)+'</div>';
  });
  const upC = cwd.length ? '#444' : '#CACACA', backC = S.rHistory.length ? '#444' : '#CACACA';
  const toolbar = '<div style="flex-shrink:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)">'
    + '<div class="link iconbtn" data-act="rback" style="width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center">'+icon('arrowLeft',backC,16)+'</div>'
    + '<div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center">'+icon('arrowRight','#CACACA',16)+'</div>'
    + '<div class="link iconbtn" data-act="rup" style="width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center">'+icon('arrowUp',upC,16)+'</div>'
    + '<div style="flex:1 1 auto;min-width:200px;height:32px;border:1px solid #D9D9D9;border-radius:4px;background:#fff;display:flex;align-items:center;padding:0 10px;overflow:hidden">'
      + '<span class="mono" style="font-size:12px;color:#7C8A94;margin-right:6px;flex-shrink:0">Computer\\</span>'
      + '<div style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow:hidden">'+crumbs+'</div></div></div>';

  /* left: key tree */
  let navRows = '';
  const walk = (n, segs, depth) => {
    const key = segs.join('/');
    const dirs = sortKids(n);
    const open = depth === 0 ? true : !!S.rExpanded[key];
    const onSel = key === cwd.join('/');
    const caret = dirs.length ? (open?'caretDown':'caretRight') : '';
    navRows += '<div class="link navrow" data-act="rnav" data-segs="'+A(key)+'" style="height:28px;display:flex;align-items:center;gap:4px;border-radius:4px;padding-right:6px;padding-left:'+(6+depth*14)+'px;background:'+(onSel?'#ECEEF0':'transparent')+'">'
      + '<div class="link" data-act="rtoggle" data-key="'+A(key)+'" style="width:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center">'+(caret?icon(caret,'#555',10):'')+'</div>'
      + icon('folder', depth===0?'#5B8D9E':'#B79A5B',15)
      + '<div style="font-size:13px;color:#1B1B1B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(depth===0?root:n.name)+'</div></div>';
    if (open) dirs.forEach(ch => walk(ch, segs.concat([ch.name]), depth+1));
  };
  walk(rootNode, [], 0);

  /* main: subkeys of current key */
  const node = regNodeAt(root, cwd) || rootNode;
  const kids = sortKids(node);
  let list = '';
  kids.forEach(ch => {
    const segs = cwd.concat([ch.name]);
    const rel = segs.join('/');
    const on = S.rSelected === rel;
    list += '<div class="link filerow" data-act="rsel" data-rel="'+A(rel)+'" data-open="'+A(rel)+'" style="height:30px;display:flex;align-items:center;padding:0 12px;margin:0 4px;border-radius:4px;background:'+(on?'#E3E7E9':'transparent')+'">'
      + '<div style="flex:1 1 auto;min-width:150px;display:flex;align-items:center;gap:10px">'+icon('folder','#B79A5B',16)
      + '<div style="font-size:13px;color:#1B1B1B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+E(ch.name)+'</div></div>'
      + '<div style="flex:0 1 auto;font-size:12px;color:#999">Key</div></div>';
  });
  if (!kids.length){
    list = '<div style="padding:14px 16px;font-size:13px;color:#999">This key has no subkeys — its values live here. Select it in the tree and confirm.</div>';
  }

  const colHead = '<div style="flex-shrink:0;height:30px;display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 12px;font-size:12px;color:#555">'
    + '<div style="flex:1 1 auto;min-width:150px">Name</div><div style="flex:0 1 auto">Type</div></div>';
  const status = '<div style="flex-shrink:0;height:28px;background:#FAFAFA;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:12px;color:#555;gap:16px">'
    + '<div>'+kids.length+' keys</div><div>'+(S.rSelected?'1 key selected':'')+'</div></div>';

  const body = '<div style="flex:1;min-height:420px;display:flex">'
    + '<div style="width:clamp(150px,28%,260px);flex-shrink:0;background:#FAFAFA;border-right:1px solid var(--line);padding:8px 6px;overflow:auto">'+navRows+'</div>'
    + '<div style="flex:1;min-width:0;display:flex;flex-direction:column">'+colHead
    + '<div style="flex:1;overflow-y:auto;padding:4px 0">'+list+'</div>'+status+'</div></div>';

  return '<div style="position:relative;min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden;font-family:\'Segoe UI Variable Text\',\'Segoe UI\',system-ui,sans-serif">'
    + chrome + toolbar + body + '</div>';
}

function render(){
  const app = document.getElementById('app');
  /* Build the persistent shell once. From then on we only swap the screen
     body, so header and footer never flicker and clicks inside a screen
     (navigating, selecting) don't rebuild the whole page. */
  if (!app._shellBuilt){
    app.innerHTML = '<div id="pf-hdr"></div>'
      + '<div id="pf-screen" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>'
      + '<div id="pf-ftr"></div>';
    document.getElementById('pf-ftr').innerHTML = footer();
    app._shellBuilt = true;
  }
  let body;
  if (S.screen === 'start') body = startScreen();
  else if (S.screen === 'game') body = gameScreen();
  else if (S.screen === 'done') body = doneScreen();
  else if (S.screen === 'imprint') body = legalScreen('imprint');
  else if (S.screen === 'privacy') body = legalScreen('privacy');
  else body = startScreen();

  const screenChanged = app._rendered !== S.screen;
  /* header only changes between screens — leave it alone on in-screen clicks */
  if (screenChanged) document.getElementById('pf-hdr').innerHTML = header();

  /* on a phone, the game is full-bleed — hide the footer chrome there */
  document.getElementById('pf-ftr').style.display = (isMobile() && S.screen==='game') ? 'none' : '';

  const scr = document.getElementById('pf-screen');
  scr.innerHTML = body;
  /* play the fade-in only when the screen actually changes, never on every click */
  if (screenChanged){ scr.classList.remove('fade'); void scr.offsetWidth; scr.classList.add('fade'); }
  app._rendered = S.screen;

  /* wire up the expert text input without re-rendering on each keystroke */
  const inp = document.getElementById('typed');
  if (inp){
    inp.addEventListener('input', e => { S.typed = e.target.value; });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && S.typed.trim() && !S.fb) confirm(); });
    inp.focus();
    const v = inp.value; inp.value = ''; inp.value = v; /* caret to end */
  }

  /* wire native drag-and-drop for the DFIR-match cards (tap still works via delegation) */
  if (S.matching && document.querySelectorAll){
    const tok = document.getElementById('match-token');
    if (tok) tok.addEventListener('dragstart', e => { if (e.dataTransfer){ e.dataTransfer.setData('text/plain','t'); e.dataTransfer.effectAllowed='move'; } });
    document.querySelectorAll('.matchcard').forEach(card => {
      card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('over'); });
      card.addEventListener('dragleave', () => card.classList.remove('over'));
      card.addEventListener('drop', e => { e.preventDefault(); card.classList.remove('over'); chooseMatch(+card.getAttribute('data-idx')); });
    });
  }
}

/* ------------------------------ event routing ----------------------------- */
document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  switch(act){
    case 'home': setState({screen:'start'}); break;
    case 'imprint': setState({backTo: (S.screen==='imprint'||S.screen==='privacy')?S.backTo:S.screen, screen:'imprint'}); break;
    case 'privacy': setState({backTo: (S.screen==='imprint'||S.screen==='privacy')?S.backTo:S.screen, screen:'privacy'}); break;
    case 'leaveLegal': setState({screen: S.backTo || 'start'}); break;
    case 'os': {
      const k = el.getAttribute('data-os');
      _treeCache = {};
      setState({os:k, ver: VERS[k].length-1, cwd:[], history:[], expanded:{}, selected:null, typed:'',
        regOn: k==='win' ? S.regOn : false, phase:1, rCwd:[], rHistory:[], rExpanded:{}, rSelected:null, matching:false, matchPicks:null});
      break;
    }
    case 'ver': _treeCache = {}; setState({ver: +el.getAttribute('data-ver'), cwd:[], history:[], expanded:{}, selected:null, typed:''}); break;
    case 'cat': setState({cat: el.getAttribute('data-cat')}); break;
    case 'level': { const n = +el.getAttribute('data-level'); setState({level:n, roundLen:(n===2||n===4)?5:10, typed:''}); break; }
    case 'len': setState({roundLen: +el.getAttribute('data-len')}); break;
    case 'regtoggle': if (S.os==='win' && S.level===1) setState({regOn: !S.regOn}); break;
    case 'matchtoggle': if (S.level===1) setState({matchOn: !S.matchOn}); break;
    case 'start': {
      const pool = isMulti()?SCEN():catArt();
      if (pool.length === 0) break;
      setState({screen:'game', queue: buildQueue(), idx:0, score:0, log:[], cwd:[], selected:null, typed:'', hintShown:false, fb:null, history:[], found:[], wrong:0, flash:null,
        phase:1, rCwd:[], rHistory:[], rExpanded:{}, rSelected:null, more:null, sheet:false, peek:false, matching:false, matchPicks:null, matchWrong:0});
      break;
    }
    case 'quit': setState({screen:'done', fb:null}); break;
    case 'restart': setState({screen:'start'}); break;
    case 'nav': navigate(el.getAttribute('data-segs') ? el.getAttribute('data-segs').split('/') : []); break;
    case 'toggle': {
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const open = key ? !!S.expanded[key] : true;
      const exp = Object.assign({}, S.expanded); exp[key] = !open;
      setState({expanded: exp});
      break;
    }
    case 'up': if (S.cwd.length) navigate(S.cwd.slice(0,-1)); break;
    case 'back': if (S.history.length){ const h = S.history.slice(); const prev = h.pop(); setState({cwd:prev, history:h, selected:null}); } break;
    case 'rnav': regNavigate(el.getAttribute('data-segs') ? el.getAttribute('data-segs').split('/') : []); break;
    case 'rtoggle': {
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const open = key ? !!S.rExpanded[key] : true;
      const exp = Object.assign({}, S.rExpanded); exp[key] = !open;
      setState({rExpanded: exp});
      break;
    }
    case 'rup': if (S.rCwd.length) regNavigate(S.rCwd.slice(0,-1)); break;
    case 'rback': if (S.rHistory.length){ const h = S.rHistory.slice(); const prev = h.pop(); setState({rCwd:prev, rHistory:h, rSelected:null}); } break;
    case 'rsel': {
      const rel = el.getAttribute('data-rel');
      const now = Date.now();
      if (_lastClick.rel === rel && (now - _lastClick.t) < 400){
        _lastClick = {rel:null, t:0};
        regNavigate(rel.split('/'));
      } else {
        _lastClick = {rel, t:now};
        setState({rSelected: rel});
      }
      break;
    }
    case 'reveal': {
      const rel = el.getAttribute('data-rel'), prefix = el.getAttribute('data-prefix')==='1';
      setState(Object.assign({phase:1, more:null, peek:true}, expandTo(rel, prefix)));
      break;
    }
    case 'rreveal': {
      const key = el.getAttribute('data-key');
      setState(Object.assign({phase:2, more:null, peek:true}, regExpandTo(key)));
      break;
    }
    case 'match': chooseMatch(+el.getAttribute('data-idx')); break;
    case 'more': setState({more: el.getAttribute('data-id')}); break;
    case 'moreClose': setState({more:null}); break;
    case 'sheet': setState({sheet:true}); break;
    case 'sheetClose': setState({sheet:false}); break;
    case 'unpeek': setState({peek:false}); break;
    case 'stop': break;
    case 'sel': {
      const rel = el.getAttribute('data-rel');
      const canOpen = el.hasAttribute('data-open'); /* set only for folders */
      const now = Date.now();
      /* Manual double-click: a second click on the same folder within 400 ms
         opens it. We can't rely on the native dblclick event because selecting
         re-renders the list and replaces the DOM node between the two clicks. */
      if (canOpen && _lastClick.rel === rel && (now - _lastClick.t) < 400){
        _lastClick = {rel:null, t:0};
        navigate(rel.split('/'));
      } else {
        _lastClick = {rel, t:now};
        setState({selected: rel});
      }
      break;
    }
    case 'confirm': if (!(el.getAttribute('aria-disabled')==='true')) confirm(); break;
    case 'hint': setState({hintShown:true}); break;
    case 'skip':
      S.sheet = false; S.matching = false; S.matchPicks = null;
      if (regActive() && regCapable(cur().id)) gradeRegDone(false);
      else if (isMulti()) closeScenario(false, S.found);
      else gradeSingle(false);
      break;
    case 'next': {
      if (S.idx >= S.queue.length-1) setState({screen:'done', fb:null, sheet:false, peek:false});
      else setState({idx:S.idx+1, fb:null, selected:null, typed:'', hintShown:false, found:[], wrong:0, flash:null,
        phase:1, rCwd:[], rHistory:[], rExpanded:{}, rSelected:null, more:null, sheet:false, peek:false, matching:false, matchPicks:null, matchWrong:0});
      break;
    }
  }
});
