<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>pathfinder — DFIR artifact drill</title>
<meta name="description" content="A hands-on drill for digital forensics: click the path to every Windows and macOS artifact inside a rebuilt file explorer.">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nIzFFMjIyNicvPjxwYXRoIGQ9J005IDExbDUgNS01IDUnIGZpbGw9J25vbmUnIHN0cm9rZT0nIzBFN0E0QScgc3Ryb2tlLXdpZHRoPScyLjgnIHN0cm9rZS1saW5lY2FwPSdyb3VuZCcgc3Ryb2tlLWxpbmVqb2luPSdyb3VuZCcvPjxyZWN0IHg9JzE2LjUnIHk9JzE5LjYnIHdpZHRoPSc4LjUnIGhlaWdodD0nMi44JyByeD0nMS40JyBmaWxsPScjMEU3QTRBJy8+PC9zdmc+">
<meta name="theme-color" content="#1E2226">
<style>
  :root{
    --green:#0E7A4A; --green-d:#0A5F39; --ink:#1E2226; --ink2:#2E3338;
    --text:#444444; --muted:#777777; --grey:#8A9095; --line:#EFEFEF; --bg:#F4F5F6;
    --red:#85222C; --panel:#F4F6F7;
    --mono:'Consolas','SFMono-Regular','Menlo','Monaco',monospace;
    --sans:'Barlow Semi Condensed','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);font-family:var(--sans);color:var(--text)}
  a{color:var(--green);text-decoration:none}
  a:hover{color:var(--green-d)}
  .mono{font-family:var(--mono)}
  .app{min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit}
  input{font-family:inherit}
  ::selection{background:rgba(14,122,74,.18)}
  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:8px;
    background:var(--green);color:#fff;font-size:18px;font-weight:600;border:none;cursor:pointer;transition:background .12s}
  .btn:hover{background:var(--green-d)}
  .btn:disabled,.btn[aria-disabled=true]{background:#CFD4D7;color:#fff;cursor:not-allowed}
  .btn.sm{height:40px;font-size:16px;padding:0 16px}
  .btn.out{background:#fff;color:var(--ink);border:1px solid #CACACA}
  .btn.out:hover{background:#F3F3F3;color:var(--ink)}
  .btn.danger{background:var(--red)}
  .btn.danger:hover{background:#6B1A22}
  .chip{cursor:pointer;user-select:none}
  /* explorer rows hover */
  .navrow:hover,.filerow:hover{background:#EFEFEF!important}
  .filerow:hover{background:#F1F1F1!important}
  .crumb:hover{background:#EFEFEF}
  .iconbtn:hover{background:#EFEFEF}
  .link{cursor:pointer}
  .revpath{cursor:pointer}
  .revpath:hover{text-decoration:underline}
  .matchcard{transition:border-color .1s, background .1s}
  .matchcard:hover{border-color:var(--green)!important;background:#F6FBF8!important}
  .matchcard.over{border-color:var(--green)!important;background:#EAF6EF!important;box-shadow:0 0 0 2px rgba(14,122,74,.25)}
  #match-token{cursor:grab}
  #match-token:active{cursor:grabbing}
  .fade{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  /* start-screen two-column layout: controls left, permanent guide right */
  .start-wrap{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:44px;align-items:start}
  .start-aside{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:22px 24px}
  @media (max-width:1040px){
    .start-wrap{grid-template-columns:1fr;max-width:700px!important;gap:30px}
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D2D6D9;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#B9BEC2;background-clip:content-box}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
"use strict";
/* ============================================================================
   pathfinder — DFIR artifact drill
   Standalone rebuild of the 89deg design-comp. Vanilla JS, no dependencies,
   no cookies, no network. All game logic + artifact catalogue below.
   ========================================================================== */

/* ---------- tiny SVG icon set (24 viewBox, uses currentColor) ------------- */
const ICONS = {
  folder:'<path fill="currentColor" d="M3.2 6.3c0-1 .8-1.8 1.8-1.8h4.2l2 2h7.8c1 0 1.8.8 1.8 1.8v9.2c0 1-.8 1.8-1.8 1.8H5c-1 0-1.8-.8-1.8-1.8V6.3z"/>',
  hardDrive:'<rect x="3" y="7.5" width="18" height="9" rx="2.2" fill="currentColor"/><circle cx="17" cy="12" r="1.3" fill="#fff"/>',
  hardDrives:'<rect x="3" y="4.5" width="18" height="6.2" rx="1.8" fill="currentColor"/><rect x="3" y="13.3" width="18" height="6.2" rx="1.8" fill="currentColor"/><circle cx="17" cy="7.6" r="1" fill="#fff"/><circle cx="17" cy="16.4" r="1" fill="#fff"/>',
  file:'<path fill="currentColor" d="M6 2.5h7l5 5v14H6z" opacity=".9"/><path fill="#fff" d="M13 2.5v5h5z" opacity=".55"/>',
  fileText:'<path fill="currentColor" d="M6 2.5h7l5 5v14H6z"/><g stroke="#fff" stroke-width="1.1"><path d="M8.5 12h7M8.5 15h7M8.5 18h4.5"/></g>',
  database:'<ellipse cx="12" cy="6" rx="7" ry="2.6" fill="currentColor"/><path fill="currentColor" d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6c0 1.4-3.1 2.6-7 2.6S5 7.4 5 6z" opacity=".82"/>',
  bolt:'<path fill="currentColor" d="M13.5 2 4.5 13.2h5.2L9 22l9.5-11.6h-5.4z"/>',
  scroll:'<rect x="5" y="3.5" width="14" height="17" rx="2" fill="currentColor"/><g stroke="#fff" stroke-width="1.1"><path d="M8 8h8M8 11h8M8 14h6"/></g>',
  app:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.4" fill="currentColor"/><path stroke="#fff" stroke-width="1.2" d="M3.5 9h17"/><circle cx="6.5" cy="6.7" r=".8" fill="#fff"/>',
  zip:'<path fill="currentColor" d="M6 2.5h7l5 5v14H6z"/><rect x="10.4" y="4" width="2.2" height="8" fill="#fff"/>',
  disk:'<circle cx="12" cy="12" r="8.5" fill="currentColor"/><circle cx="12" cy="12" r="2.4" fill="#fff"/>',
  code:'<path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M9 8l-4 4 4 4M15 8l4 4-4 4"/>',
  arrowLeft:'<path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/>',
  arrowRight:'<path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/>',
  arrowUp:'<path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M6 15l6-6 6 6"/>',
  caretRight:'<path fill="currentColor" d="M9 5l7 7-7 7z"/>',
  caretDown:'<path fill="currentColor" d="M5 9l7 7 7-7z"/>',
  check:'<circle cx="12" cy="12" r="9" fill="currentColor"/><path fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M8 12.4l2.6 2.6L16 9.4"/>',
  x:'<circle cx="12" cy="12" r="9" fill="currentColor"/><path fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" d="M9 9l6 6M15 9l-6 6"/>',
  dashed:'<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3 3"/>',
  lock:'<rect x="5.5" y="10.5" width="13" height="9.5" rx="2" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  search:'<circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.5 15.5l4 4"/>',
  windows:'<path fill="currentColor" d="M3 5.5l7.5-1v7H3zM11.4 4.3L21 3v8.5h-9.6zM3 12.5h7.5v6.9L3 18.5zM11.4 12.5H21V21l-9.6-1.3z"/>',
  apple:'<path fill="currentColor" d="M16 2.2c.1 1-.3 2-1 2.8-.7.8-1.8 1.4-2.8 1.3-.1-1 .4-2 1-2.7.8-.8 2-1.4 2.8-1.4zM19.4 17c-.5 1.2-.8 1.7-1.5 2.7-1 1.5-2.4 3.3-4.1 3.3-1.5 0-1.9-1-4-1-2 0-2.5 1-4 1-1.7 0-3-1.6-4-3.1-2.8-4.2-3.1-9.2-1.4-11.8 1.2-1.9 3.1-3 4.9-3 1.8 0 3 1 4.5 1 1.5 0 2.3-1 4.5-1 1.6 0 3.3.9 4.5 2.4-4 2.2-3.3 7.9.1 9.5z"/>',
  target:'<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
};
function icon(name, color, size){
  size = size || 16;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" style="color:'+(color||'#7C8A94')+';flex-shrink:0;vertical-align:middle" aria-hidden="true">'+(ICONS[name]||ICONS.file)+'</svg>';
}

/* ------------------------------- catalogue -------------------------------- */
/* Every artifact carries a category (cat), a relative path (rel, forward
   slashes, no drive / leading slash), and version bounds since/until as
   indices into the version array of its OS. prefix=true means the whole
   folder counts as the answer (any child path is accepted too).            */

const CATS = [
  {id:'all',    label:'All categories', short:'All'},
  {id:'exec',   label:'Program execution', short:'Execution'},
  {id:'persist',label:'Persistence', short:'Persistence'},
  {id:'files',  label:'File & folder access', short:'File access'},
  {id:'web',    label:'Web & downloads', short:'Web'},
  {id:'usb',    label:'Devices & USB', short:'USB'},
  {id:'logon',  label:'Accounts & logon', short:'Logon'},
];

const WIN_ART = [
  /* -- execution -- */
  {id:'prefetch',cat:'exec',name:'Prefetch',sub:'Per-executable run records from the cache manager.',rel:'Windows/Prefetch',prefix:true,since:0,
   why:'One .pf file per executable, holding the first and last eight execution timestamps, a run counter and the files the binary loaded. Enabled on client Windows, off by default on Server.',tool:'PECmd'},
  {id:'amcache',cat:'exec',name:'AmCache',sub:'Registry hive of binaries seen and run.',rel:'Windows/appcompat/Programs/Amcache.hve',since:1,folderOk:true,
   why:'Records full path, SHA-1, PE metadata and first-run timestamps for executables. It survives deletion of the binary, which makes it the go-to when the file itself is gone.',tool:'AmcacheParser'},
  {id:'recentfilecache',cat:'exec',name:'RecentFileCache',sub:'The pre-AmCache appcompat artifact (Win7).',rel:'Windows/appcompat/Programs/RecentFileCache.bcf',since:0,until:0,
   why:'Windows 7 before the AmCache era logs only newly executed binaries here, as a flat list of paths with no hashes and no per-file timestamps. AmCache replaces it from Windows 8 onward.',tool:'RecentFileCacheParser'},
  {id:'pca',cat:'exec',name:'PCA app launch log',sub:'Plain-text launch list, new in Windows 11.',rel:'Windows/appcompat/pca/PcaAppLaunchDic.txt',since:2,folderOk:true,
   why:'The Program Compatibility Assistant writes executable path and last execution time as text, one entry per line. Only present from Windows 11 onward and often overlooked.',tool:'any text editor'},
  {id:'srum',cat:'exec',name:'SRUM',sub:'Resource usage: bytes moved, per process, per user.',rel:'Windows/System32/sru/SRUDB.dat',since:1,folderOk:true,
   why:'System Resource Usage Monitor keeps roughly 30 days of hourly rollups per application and user SID, including network bytes sent and received. Strong for proving execution plus data volume.',tool:'SrumECmd'},
  {id:'shimcache',cat:'exec',name:'ShimCache (AppCompatCache)',sub:'Application-compatibility cache — proof a binary was present.',rel:'Windows/System32/config/SYSTEM',since:0,
   why:'AppCompatCache under ControlSet\\Control\\Session Manager records the file path and the $Standard_Information modified time for binaries the shim engine encountered. It proves presence, not execution, and on Windows 10+ is written only at shutdown.',tool:'AppCompatCacheParser, RECmd'},
  {id:'bam',cat:'exec',name:'BAM / DAM',sub:'Background Activity Moderator — last run time, per user.',rel:'Windows/System32/config/SYSTEM',since:1,
   why:'The Background/Desktop Activity Moderator services record, under Services\\bam\\State\\UserSettings\\<SID>, the full path and a last-execution FILETIME for each program a user ran. Unlike ShimCache this is genuine execution evidence, tied to a user SID.',tool:'RECmd, BAM parser'},
  {id:'userassist',cat:'exec',name:'UserAssist',sub:'GUI launch counts, tracked per user.',rel:'Users/j.doe/NTUSER.DAT',since:0,
   why:'Under Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\UserAssist, program names ROT13-encoded, plus run count and last execution. Covers only programs launched through the shell.',tool:'RegRipper, RECmd'},
  {id:'sec4688',cat:'exec',name:'Process creation events',sub:'Event ID 4688, when auditing is on.',rel:'Windows/System32/winevt/Logs/Security.evtx',since:0,
   why:'4688 records the new process, its parent and the invoking user; the command line is included only if the audit policy was enabled. 4689 marks process exit.',tool:'EvtxECmd'},
  {id:'sysmon',cat:'exec',name:'Sysmon process events',sub:'Event ID 1, if the host runs Sysmon.',rel:'Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx',since:0,
   why:'Event ID 1 carries full command line, parent process, working directory, user and hashes. Richer than 4688, but only exists where Sysmon was deployed before the incident.',tool:'EvtxECmd, Chainsaw'},
  {id:'muicache',cat:'exec',name:'MUICache',sub:'Friendly-name cache for executables run in the GUI.',rel:'Users/j.doe/AppData/Local/Microsoft/Windows/UsrClass.dat',since:0,
   why:'Under Software\\Classes\\Local Settings\\...\\MuiCache in UsrClass.dat, one value per executable path with its FileDescription. Proves the binary was present and shell-launched, but carries no timestamps.',tool:'RegRipper, RECmd'},
  {id:'timeline',cat:'exec',name:'Windows Timeline',sub:'Activity DB behind the old Task View history.',rel:'Users/j.doe/AppData/Local/ConnectedDevicesPlatform/L.j.doe/ActivitiesCache.db',since:1,until:1,folderOk:true,
   why:'SQLite rows per activity with start and end time, the application ID and, for some entries, the arguments. A Windows 10 artifact — the Task View timeline was removed in Windows 11.',tool:'WxTCmd'},
  {id:'jumplists',cat:'exec',name:'Jump Lists',sub:'Per-application usage lists in the user profile.',rel:'Users/j.doe/AppData/Roaming/Microsoft/Windows/Recent/AutomaticDestinations',prefix:true,since:0,
   why:'One .automaticDestinations-ms per application. The AppID identifies the program, the DestList stream records how often and when it was used and which files it opened.',tool:'JLECmd'},

  /* -- persistence -- */
  {id:'run_user',cat:'persist',name:'Run / RunOnce (user)',sub:'Per-user autostart entries in the registry.',rel:'Users/j.doe/NTUSER.DAT',since:0,
   why:'Software\\Microsoft\\Windows\\CurrentVersion\\Run and RunOnce launch a command at every logon for this user. No admin rights required, which makes it the cheapest persistence on Windows.',tool:'RegRipper, RECmd'},
  {id:'run_sys',cat:'persist',name:'Run keys (machine)',sub:'System-wide autostart entries in the registry.',rel:'Windows/System32/config/SOFTWARE',since:0,
   why:'Microsoft\\Windows\\CurrentVersion\\Run and the Winlogon Shell/Userinit values run for every user at boot or logon. Needs admin to write, so it signals privileged access.',tool:'RegRipper, RECmd'},
  {id:'tasks',cat:'persist',name:'Scheduled Tasks',sub:'On-disk task definitions as XML.',rel:'Windows/System32/Tasks',prefix:true,since:0,
   why:'One XML file per task with the trigger, the action (the command to run) and the author. Pairs with Microsoft-Windows-TaskScheduler%4Operational events for registration and run times.',tool:'any text editor, TaskScheduler'},
  {id:'services',cat:'persist',name:'Services',sub:'Installed service definitions in the registry.',rel:'Windows/System32/config/SYSTEM',since:0,
   why:'Under ControlSet\\Services each subkey holds ImagePath, Start type and the account. Start=2 is auto-start persistence; a service pointing at a user-writable path or a lone DLL is a red flag.',tool:'RegRipper, RECmd'},
  {id:'startup',cat:'persist',name:'Startup folder',sub:'Shortcuts launched at logon.',rel:'Users/j.doe/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup',prefix:true,since:0,
   why:'Anything dropped here — usually a .lnk — is launched when the user logs on. The oldest and most visible persistence spot, but still routinely abused.',tool:'LECmd, any text editor'},
  {id:'wmi',cat:'persist',name:'WMI event subscription',sub:'Fileless persistence in the CIM repository.',rel:'Windows/System32/wbem/Repository/OBJECTS.DATA',since:0,
   why:'An EventFilter bound to a CommandLineEventConsumer fires arbitrary code on a system event, with nothing on the file system to see. Lives entirely in the WMI repository.',tool:'PyWMIPersistenceFinder'},

  /* -- file & folder access -- */
  {id:'shellbags',cat:'files',name:'ShellBags',sub:'Folder browsing history, even for gone folders.',rel:'Users/j.doe/AppData/Local/Microsoft/Windows/UsrClass.dat',since:0,
   why:'Explorer stores view settings per folder in UsrClass.dat (BagMRU/Bags). It proves a folder — including on removable or network drives — was opened, and it survives the folder being deleted.',tool:'SBECmd, RECmd'},
  {id:'lnk_recent',cat:'files',name:'LNK / Recent files',sub:'Auto-created shortcuts to opened files.',rel:'Users/j.doe/AppData/Roaming/Microsoft/Windows/Recent',prefix:true,since:0,
   why:'Windows drops a .lnk here whenever a file is opened. Each shortcut embeds the target path, volume serial, size and MAC timestamps, and outlives the original file.',tool:'LECmd'},
  {id:'recentdocs',cat:'files',name:'RecentDocs',sub:'Most-recently-opened documents, per extension.',rel:'Users/j.doe/NTUSER.DAT',since:0,
   why:'Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RecentDocs keeps an MRU of opened file names grouped by extension, with the folder-level MRU showing the last one touched.',tool:'RegRipper, RECmd'},
  {id:'thumbcache',cat:'files',name:'Thumbnail cache',sub:'Cached thumbnails of viewed files.',rel:'Users/j.doe/AppData/Local/Microsoft/Windows/Explorer/thumbcache_256.db',since:0,
   why:'When a folder is viewed with thumbnails, Explorer caches image previews here by size. The picture can survive deletion of the original file, proving it once existed and was viewed.',tool:'Thumbcache Viewer'},
  {id:'recyclebin',cat:'files',name:'Recycle Bin',sub:'Deleted files awaiting purge.',rel:'$Recycle.Bin',prefix:true,since:0,
   why:'Per-SID subfolders hold the recycled content ($R files) alongside $I metadata files that record the original path, size and deletion time. Direct proof of a deliberate delete.',tool:'RBCmd'},
  {id:'mft',cat:'files',name:'$MFT',sub:'The Master File Table of the NTFS volume.',rel:'$MFT',since:0,
   why:'One record per file and folder with the $STANDARD_INFORMATION and $FILENAME timestamp sets. Comparing the two exposes timestomping, and resident data recovers small deleted files.',tool:'MFTECmd'},
  {id:'usnjrnl',cat:'files',name:'$UsnJrnl',sub:'The NTFS change journal.',rel:'$Extend/$UsnJrnl',since:0,
   why:'The $J stream records every create, rename, write and delete on the volume with a reason code and timestamp. It reconstructs file activity long after the files themselves are gone.',tool:'MFTECmd'},

  /* -- web & downloads -- */
  {id:'chrome_hist',cat:'web',name:'Chrome history',sub:'Browsing and download records, SQLite.',rel:'Users/j.doe/AppData/Local/Google/Chrome/User Data/Default/History',since:0,
   why:'The urls and visits tables hold every page and visit time; the downloads table records the target path, source URL, referrer, bytes and start/end time. First stop for web-delivered payloads.',tool:'sqlite3, DB Browser'},
  {id:'edge_hist',cat:'web',name:'Edge history',sub:'Chromium Edge browsing / downloads.',rel:'Users/j.doe/AppData/Local/Microsoft/Edge/User Data/Default/History',since:0,
   why:'Same Chromium schema as Chrome — urls, visits, downloads. Worth checking on managed hosts where Edge is the default and Chrome data is absent.',tool:'sqlite3, DB Browser'},
  {id:'webcache',cat:'web',name:'WebCacheV01.dat',sub:'IE/legacy-Edge history in an ESE database.',rel:'Users/j.doe/AppData/Local/Microsoft/Windows/WebCache/WebCacheV01.dat',since:0,folderOk:true,
   why:'An ESE database holding legacy Internet Explorer / Spartan Edge history, cache and cookie containers. Still populated by WinINet, so downloads through non-browser tooling can land here.',tool:'ESEDatabaseView'},
  {id:'zone',cat:'web',name:'Zone.Identifier (MOTW)',sub:'Mark-of-the-Web on downloaded files.',rel:'Users/j.doe/Downloads',prefix:true,since:0,
   why:'Files fetched from the internet carry a Zone.Identifier alternate data stream with ZoneId=3 and, for browser downloads, the HostUrl and ReferrerUrl. Proves origin and survives on the file itself.',tool:'dir /r, Get-Content -Stream'},

  /* -- devices & USB -- */
  {id:'usbstor',cat:'usb',name:'USBSTOR',sub:'Connected USB mass-storage devices.',rel:'Windows/System32/config/SYSTEM',since:0,
   why:'ControlSet\\Enum\\USBSTOR lists every USB storage device by vendor, product and serial number, with first/last connect and last-removal times in the device Properties. The anchor for USB analysis.',tool:'RegRipper, USBDeviceForensics'},
  {id:'mounteddev',cat:'usb',name:'MountedDevices',sub:'Drive-letter to volume mappings.',rel:'Windows/System32/config/SYSTEM',since:0,
   why:'The MountedDevices key ties a drive letter and volume GUID to a device, letting you map a USBSTOR serial to the letter it was mounted as — needed to connect a device to file-path evidence.',tool:'RegRipper'},
  {id:'setupapi',cat:'usb',name:'setupapi.dev.log',sub:'First-install log for plug-and-play devices.',rel:'Windows/INF/setupapi.dev.log',since:0,
   why:'Plain text recording the very first time each device driver was installed, i.e. the first time the device was ever plugged into this machine — a timestamp USBSTOR alone does not give you.',tool:'any text editor'},

  /* -- accounts & logon -- */
  {id:'logon_evt',cat:'logon',name:'Logon events',sub:'Event IDs 4624 / 4625 in the Security log.',rel:'Windows/System32/winevt/Logs/Security.evtx',since:0,
   why:'4624 records a successful logon with the account, source host and Logon Type (2 interactive, 3 network, 10 RemoteInteractive/RDP); 4625 records failures. The backbone of account-usage analysis.',tool:'EvtxECmd, Chainsaw'},
  {id:'sam',cat:'logon',name:'SAM hive',sub:'Local account database.',rel:'Windows/System32/config/SAM',since:0,
   why:'Holds local users and groups with the RID, last logon and last-password-set times and the login count. Reveals rogue local accounts and RID-500 renames.',tool:'RegRipper, RECmd'},
  {id:'rdp_evt',cat:'logon',name:'RDP session events',sub:'TerminalServices LocalSessionManager log.',rel:'Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx',since:0,
   why:'Event 21 (session logon), 24 (disconnect) and 25 (reconnect) record RDP sessions with the user and the source IP — the cleanest view of who came in over Remote Desktop and from where.',tool:'EvtxECmd'},
  {id:'system_evt',cat:'logon',name:'System log',sub:'Service control and driver events.',rel:'Windows/System32/winevt/Logs/System.evtx',since:0,
   why:'Event 7045 records a new service being installed (classic lateral-movement / PsExec trace), 7034/7036 service state changes, and 104 log clears. General-purpose system-side timeline.',tool:'EvtxECmd'},
];

const MAC_ART = [
  /* -- execution -- */
  {id:'unified',cat:'exec',name:'Unified Log',sub:'System-wide log store, binary .tracev3.',rel:'private/var/db/diagnostics',prefix:true,since:0,
   why:'Process launches, signing identity, XProtect and Gatekeeper decisions all land here. Retention is short, often only days, so it is the first thing to collect and the first thing to lose.',tool:'log show --archive, mac_apt'},
  {id:'knowledgec',cat:'exec',name:'KnowledgeC',sub:'Activity DB behind Screen Time / app usage.',rel:'Users/j.doe/Library/Application Support/Knowledge/knowledgeC.db',since:1,
   why:'Records app-in-focus intervals with start and end time, bundle ID and device. Strong for showing a GUI application was actually used, not merely present.',tool:'APOLLO, mac_apt'},
  {id:'execpolicy',cat:'exec',name:'ExecPolicy',sub:'Gatekeeper first-launch decisions.',rel:'private/var/db/SystemPolicyConfiguration/ExecPolicy',since:2,
   why:'Holds the hash, bundle identity and timestamp of binaries evaluated on first launch, including user approvals. Rows survive deletion of the application.',tool:'sqlite3, mac_apt'},
  {id:'spotlight',cat:'files',name:'Spotlight metadata',sub:'Filesystem metadata index.',rel:'.Spotlight-V100/Store-V2',prefix:true,since:0,
   why:'The store records kMDItem attributes for indexed files, including the download date and source URL (kMDItemWhereFroms) and the last-used date, sometimes long after the file is deleted.',tool:'mdls, spotlight_parser'},

  /* -- persistence -- */
  {id:'launchagents_u',cat:'persist',name:'User LaunchAgents',sub:'Per-user launchd jobs.',rel:'Users/j.doe/Library/LaunchAgents',prefix:true,since:0,
   why:'Property lists that launchd runs at login for this user only. No admin rights needed to write here, which makes it the cheapest persistence on macOS.',tool:'plutil, launchctl list'},
  {id:'launchdaemons',cat:'persist',name:'System LaunchDaemons',sub:'Root launchd jobs, third-party domain.',rel:'Library/LaunchDaemons',prefix:true,since:0,
   why:'Runs as root at boot, before any user logs in. /Library is the third-party domain; /System/Library is Apple-owned and protected by SIP, so malware lives in the former.',tool:'plutil, launchctl print-disabled'},
  {id:'launchagents_sys',cat:'persist',name:'System LaunchAgents',sub:'Third-party agents for all users.',rel:'Library/LaunchAgents',prefix:true,since:0,
   why:'Runs at login for any user that logs in, as that user. Third-party domain under /Library, so it needs admin to install but then persists across every account.',tool:'plutil, launchctl list'},
  {id:'btm',cat:'persist',name:'Background Task Mgmt',sub:'The BTM store behind login items (Ventura+).',rel:'private/var/db/com.apple.backgroundtaskmanagement',prefix:true,since:2,
   why:'From Ventura, launchd jobs and login items are also recorded in the BTM database, which is what "Login Items & Extensions" reads. A durable second view of persistence, harder to hide from.',tool:'sfltool, aftermath'},

  /* -- file & folder access -- */
  {id:'fsevents',cat:'files',name:'FSEvents',sub:'Volume-level record of file changes.',rel:'.fseventsd',prefix:true,since:0,

  {id:'recentitems',cat:'files',name:'Recent items',sub:'Shared file list of recently opened docs.',rel:'Users/j.doe/Library/Preferences/com.apple.recentitems.plist',since:0,
   why:'A property list of recently opened documents, applications and servers with their paths. Weak on timing but a quick view of what the user touched.',tool:'plutil, defaults read'},

  {id:'safari_hist',cat:'web',name:'Safari history',sub:'Browsing and download records.',rel:'Users/j.doe/Library/Safari/History.db',since:0,
   why:'The history_items and history_visits tables hold every page and visit time; Downloads.plist alongside it records download source URLs and destination paths.',tool:'sqlite3, mac_apt'},
  {id:'chrome_mac',cat:'web',name:'Chrome history (mac)',sub:'Chromium browsing / downloads on macOS.',rel:'Users/j.doe/Library/Application Support/Google/Chrome/Default/History',since:0,
   why:'Identical Chromium schema to Windows — urls, visits, downloads — just under ~/Library/Application Support. Check it whenever Chrome, not Safari, was the browser in use.',tool:'sqlite3, DB Browser'},

const WIN_SCEN = [
  {id:'s_shell',cat:'exec',name:'Prove a program was launched by this user',sub:'No EDR and no Sysmon on the box. Log three artifacts.',need:3,
   pool:['userassist','jumplists','timeline','prefetch'],
   why:'UserAssist counts shell launches per user, Jump Lists tie the program to the files it opened, Timeline adds start and end times, and Prefetch corroborates from the system side.'},
  {id:'s_volume',cat:'exec',name:'Prove execution and how much data the process moved',sub:'Console binary, run interactively over RDP. Log three artifacts.',need:3,
   pool:['prefetch','srum','sec4688','shimcache','bam'],
   why:'Prefetch and the SYSTEM hive place the binary in execution, SRUM adds bytes sent and received per process and user, and 4688 links it to the session and the parent process.'},
  {id:'s_deleted',cat:'exec',name:'The binary was wiped before imaging. Prove it ran anyway',sub:'Log three artifacts that outlive the file itself.',need:3,
   pool:['amcache','prefetch','shimcache','bam','sec4688','recentfilecache'],
   why:'AmCache keeps path, SHA-1 and PE metadata after the file is gone, Prefetch keeps the run counter and timestamps, ShimCache in the SYSTEM hive keeps the path, and 4688 records the process independent of the file.'},
  {id:'s_cmdline',cat:'exec',name:'Recover the full command line of the process',sub:'Windows 11 host with Sysmon deployed. Log two artifacts.',need:2,
   pool:['sysmon','sec4688'],
   why:'Sysmon Event ID 1 always carries the command line, parent process and hashes. Security 4688 carries it only where command-line auditing was switched on.'},
  {id:'s_hives',cat:'exec',name:'Registry only: prove execution from hives',sub:'No event logs, no loose files. Log three artifacts.',need:3,
   pool:['shimcache','bam','userassist','amcache','muicache'],
   why:'ShimCache and BAM live in the SYSTEM hive, UserAssist and MUICache in the user hives, and AmCache is a hive itself. All are registry-format evidence of what ran or was present.'},
  {id:'s_persist',cat:'persist',name:'Find how the implant survives a reboot',sub:'It comes back every logon. Log three persistence points.',need:3,
   pool:['run_user','run_sys','tasks','services','startup','wmi'],
   why:'Run keys, a Scheduled Task, a rogue Service, the Startup folder and a WMI subscription are the classic autostart locations. Enumerating them is how you find and pull the persistence.'},
  {id:'s_fileaccess',cat:'files',name:'Prove which folders and files the user opened',sub:'The data was on a share and a USB stick. Log three artifacts.',need:3,
   pool:['shellbags','lnk_recent','recentdocs','jumplists'],
   why:'ShellBags prove a folder — including on removable and network drives — was browsed, LNK and RecentDocs name the individual files opened, and Jump Lists tie those files to the application.'},
  {id:'s_antiforensic',cat:'files',name:'Reconstruct file activity after a wipe',sub:'Files were created and deleted to cover tracks. Log two artifacts.',need:2,
   pool:['mft','usnjrnl','recyclebin'],
   why:'The $MFT holds records and timestamps (exposing timestomping), $UsnJrnl logs every create, rename and delete on the volume, and the Recycle Bin captures what was deliberately sent to trash.'},
  {id:'s_download',cat:'web',name:'Prove a payload was downloaded from the web',sub:'It arrived through the browser. Log two artifacts.',need:2,
   pool:['chrome_hist','edge_hist','webcache','zone'],
   why:'The browser history downloads table records the URL, referrer and destination, and the Zone.Identifier stream on the file itself carries the mark-of-the-web with the host URL.'},
  {id:'s_usb',cat:'usb',name:'Prove a specific USB drive was connected',sub:'Data may have been staged to removable media. Log three artifacts.',need:3,
   pool:['usbstor','mounteddev','setupapi'],
   why:'USBSTOR identifies the device by serial and gives connect times, setupapi.dev.log dates the very first connection, and MountedDevices maps the device to the drive letter it appeared as.'},
  {id:'s_logon',cat:'logon',name:'Prove who logged on and from where',sub:'Suspected remote intrusion. Log three artifacts.',need:3,
   pool:['logon_evt','rdp_evt','sam','system_evt'],
   why:'4624/4625 give the account, logon type and source, the RDP operational log pins remote sessions to a source IP, the SAM hive exposes rogue local accounts, and 7045 in System marks new services dropped for lateral movement.'},
];

const DESC = {
  "prefetch": {intro:"Prefetch is a set of .pf files, one per executable, in C:\\Windows\\Prefetch.", os:"Windows records which code and data an application loads so it can pre-load them and make the next launch faster.", dfir:"It proves a program ran and gives the last eight run times, a run counter and the files it touched. Enabled on client Windows, off on Server, and capped, so busy hosts age entries out."},
  "amcache": {intro:"AmCache is a registry hive (Amcache.hve) under Windows\\appcompat\\Programs.", os:"Windows inventories the programs it has seen and run as part of application-compatibility telemetry.", dfir:"It keeps the full path, SHA-1, size and PE metadata of binaries and survives their deletion, but first-seen is registration, not execution — corroborate a run with Prefetch or BAM."},
  "recentfilecache": {intro:"RecentFileCache.bcf is the Windows 7 predecessor of AmCache, in Windows\\appcompat\\Programs.", os:"Windows 7 logged newly executed binaries here for the compatibility engine.", dfir:"It lists recently run programs by path only — no hashes, no timestamps — and was replaced by AmCache from Windows 8 onward."},
  "pca": {intro:"The PCA launch log (PcaAppLaunchDic.txt) is a plain-text file under Windows\\appcompat\\pca, new in Windows 11.", os:"The Program Compatibility Assistant watches apps for compatibility problems and records their launches.", dfir:"It maps executable path to a last-run time in readable text — easy proof of execution, but only for apps the PCA observed."},
  "srum": {intro:"SRUM (SRUDB.dat) is an ESE database under Windows\\System32\\sru.", os:"The System Resource Usage Monitor tracks per-application resource and network usage to feed the Data Usage view.", dfir:"It ties execution to data volume — bytes sent/received per app and user over ~30-60 days — but the latest hour may be missing until a clean shutdown."},
  "shimcache": {intro:"ShimCache (AppCompatCache) lives in the SYSTEM registry hive.", os:"The application-compatibility engine caches file paths and metadata to decide whether a program needs shims.", dfir:"It proves a binary was present (and, on older Windows, rough ordering) but not that it ran, and on Windows 10+ is written only at shutdown."},
  "bam": {intro:"BAM/DAM stores its data in the SYSTEM hive under Services\\bam\\State\\UserSettings.", os:"The Background/Desktop Activity Moderator throttles background apps and, in doing so, records what each user ran.", dfir:"It gives a genuine last-execution time and full path per program, tied to a user SID — stronger than ShimCache. Introduced in Windows 10."},
  "userassist": {intro:"UserAssist is a set of keys in the user hive (NTUSER.DAT).", os:"Explorer counts how often and when you launch programs to power the Start menu's most-used list.", dfir:"It proves a user interactively (GUI) ran a program, with run count and last-run time, but the names are ROT13-encoded and it misses command-line launches."},
  "sec4688": {intro:"Event ID 4688 is written to the Security event log (Security.evtx).", os:"Windows security auditing can log every process creation for accountability.", dfir:"It records the new process, its parent and the user, and — only if command-line auditing was enabled — the full command line. Off by default and noisy."},

  "muicache": {intro:"MUICache is a set of values in UsrClass.dat (AppData\\Local\\...\\Windows\\UsrClass.dat).", os:"The shell caches each program's friendly display name so it can show it without re-reading the file.", dfir:"It proves a binary was present and preserves its original FileDescription — useful when the file was renamed or deleted — but has no timestamps."},

  "run_user": {intro:"Run/RunOnce keys sit in the user hive (NTUSER.DAT).", os:"Software registers itself here to start automatically at this user's logon.", dfir:"It is the cheapest persistence (no admin needed); check the value data for LOLBins and payloads in Temp or AppData."},

  "tasks": {intro:"Scheduled Tasks are XML definitions under Windows\\System32\\Tasks (mirrored in the SOFTWARE hive).", os:"Task Scheduler runs programs on triggers — time, logon or events — for maintenance and updates.", dfir:"Each task names its trigger, action and author; a very common persistence and execution trace. Pair with the TaskScheduler operational log."},
  "services": {intro:"Services are defined in the SYSTEM hive under ControlSet\\Services.", os:"The Service Control Manager starts these background services, many as SYSTEM, at boot.", dfir:"ImagePath, Start type and account expose auto-start persistence; a new service also logs as System event 7045 (a classic PsExec trace)."},

  "wmi": {intro:"WMI persistence lives in the CIM repository (OBJECTS.DATA) under Windows\\System32\\wbem.", os:"WMI lets management tools react to system events via permanent event subscriptions.", dfir:"An EventFilter bound to a CommandLineEventConsumer runs code on a trigger with nothing on disk — fileless persistence that survives reboot."},

  "recyclebin": {intro:"The Recycle Bin is the hidden $Recycle.Bin folder at the drive root, with per-SID subfolders.", os:"Windows holds deleted files here so they can be restored before purging.", dfir:"The $I file records the original path, size and deletion time and the $R file the content — direct, recoverable proof of an intentional delete by a user."},
  "mft": {intro:"$MFT is the Master File Table at the root of an NTFS volume.", os:"NTFS indexes every file and folder here, one record each.", dfir:"Its two timestamp sets expose timestomping, small files are recoverable resident, and deleted records linger until reused — the backbone of an NTFS timeline."},

  "launchagents_sys": {intro:"System LaunchAgents are property lists in /Library/LaunchAgents.", os:"launchd runs these at login for any user, as that user.", dfir:"Installed with admin, they persist across every account; compare against BTM to spot orphaned or hidden jobs."},

function regCapable(id){ return !!REG[id]; }
function regActive(){ return S.regOn && S.os === 'win' && S.level === 1; }
function regPool(){ return ART().filter(a => REG[a.id] && catMatch(a)); }
/* DFIR-match add-on: after locating the artifact, match it to what it proves */
function matchActive(){ return S.matchOn && S.level === 1; }
function buildMatchPicks(correctId){
  const distractPool = ART().filter(a => a.id !== correctId && DESC[a.id]);
  const distract = distractPool.map(a => [Math.random(), a]).sort((x,y) => x[0]-y[0]).slice(0,2).map(p => p[1]);
  const raw = [correctId, distract[0].id, distract[1].id].map(id => ({id, text: DESC[id].dfir}));
  const order = raw.map(o => [Math.random(), o]).sort((a,b) => a[0]-b[0]).map(p => p[1]);
  return {options: order, correct: order.findIndex(o => o.id === correctId)};
}
let _regTreeCache = {};
function regTree(root){
  if (_regTreeCache[root]) return _regTreeCache[root];
  const node = {name:root, dir:true, children:{}};
  (REG_TREES[root]||[]).forEach(entry => {
    const parts = entry.replace(/\/$/,'').split('/');
    let n = node;
    parts.forEach(p => { if (!n.children[p]) n.children[p] = {name:p, dir:true, children:{}}; n = n.children[p]; });
  });
  _regTreeCache[root] = node;
  return node;
}
function regNodeAt(root, segs){ let n = regTree(root); for (const s of segs){ if (!n.children[s]) return null; n = n.children[s]; } return n; }
function regMatches(id, selRel){
  const r = REG[id]; if (!r) return false;
  return r.prefix ? (selRel === r.key || selRel.indexOf(r.key + '/') === 0) : selRel === r.key;
}
function regDisplay(id, keyRel){ const r = REG[id]; return r.root + '\\' + (keyRel||r.key).replace(/\//g,'\\'); }

/* ------------------------------ derived data ------------------------------ */
const cfg = () => OSCFG[S.os];
const vlist = () => VERS[S.os];
const vidx = () => Math.min(S.ver, vlist().length-1);
const sep = () => S.os === 'mac' ? '/' : '\\';

function present(a){
  const vi = vidx();
  const since = a.since || 0;
  const until = (a.until == null) ? vlist().length-1 : a.until;
  return vi >= since && vi <= until;
}
function ART(){ return cfg().art.filter(present); }
function art(id){ return ART().find(a => a.id === id); }
function isMulti(){ return S.level === 2 || S.level === 4; }
function isExpert(){ return S.level === 3 || S.level === 4; }
function isMobile(){ return S.vw < 760; }

function catMatch(item){ return S.cat === 'all' || item.cat === S.cat; }

function SCEN(){
  const ids = ART().map(a => a.id);
  return cfg().scen.filter(catMatch).map(s => {
    const pool = s.pool.filter(id => ids.indexOf(id) >= 0);
    return Object.assign({}, s, {pool, need: Math.min(s.need, pool.length)});
  }).filter(s => s.need >= 2);
}
function catArt(){ return ART().filter(catMatch); }

/* ------------------------- filesystem tree -------------------------------- */
function relOf(a){ return a.rel + (a.prefix ? '/' : ''); }

function fsList(){
  const presentRels = ART().map(a => a.rel);
  const absentRels = cfg().art.filter(a => !present(a)).map(a => a.rel).filter(r => presentRels.indexOf(r) < 0);
  let out = cfg().decoy.filter(d => absentRels.indexOf(d.replace(/\/$/,'')) < 0).slice();
  ART().forEach(a => out.push(relOf(a)));
  return out;
}

let _treeCache = {};
function tree(){
  const key = S.os + '|' + vidx();
  if (_treeCache[key]) return _treeCache[key];
  const root = {name: cfg().rootLabel, dir:true, children:{}};
  fsList().forEach(entry => {
    const isDir = entry.endsWith('/');
    const parts = entry.replace(/\/$/,'').split('/');
    let node = root;
    parts.forEach((p,i) => {
      const last = i === parts.length-1;
      if (!node.children[p]) node.children[p] = {name:p, dir: isDir || !last, children:{}};
      node = node.children[p];
    });
  });
  _treeCache[key] = root;
  return root;
}
function nodeAt(segs){ let n = tree(); for (const s of segs){ if (!n.children[s]) return null; n = n.children[s]; } return n; }
function sortKids(node){
  return Object.keys(node.children).map(k => node.children[k]).sort((a,b) => {
    if (a.dir !== b.dir) return a.dir ? -1 : 1;
    return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
  });
}

/* deterministic file metadata (date/size/kind/icon) */
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619);} return Math.abs(h); }
function metaFor(node, rel){
  const h = hashStr(rel);
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'][h%8];
  const day = (h>>3)%28+1, hr = (h>>6)%12+1, mi = (h>>9)%60, ap = (h>>4)%2 ? 'AM':'PM';
  const date = mo+' '+day+', 2026  '+hr+':'+String(mi).padStart(2,'0')+' '+ap;
  if (node.dir) return {date, kind: S.os==='mac'?'Folder':'File folder', size:''};
  const name = node.name;
  const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
  const kb = (h>>5)%9400 + 12;
  if (S.os === 'mac'){
    const mk = {plist:'Property List',db:'SQLite database',tracev3:'Log archive',log:'Log file',rtf:'Rich Text',pages:'Pages document',dmg:'Disk Image',app:'Application'}[ext]
      || (name.charAt(0)==='.'?'Unix file':(ext?ext.toUpperCase()+' file':'Unix file'));
    return {date, kind:mk, size:(kb/1024).toFixed(1)+' MB'};
  }
  const kinds = {pf:'PF File',hve:'HVE File',bcf:'BCF File',dat:'DAT File',db:'Data Base File',evtx:'Event Log',txt:'Text Document',log:'Text Document',exe:'Application',zip:'Compressed Folder',docx:'Word Document',sys:'System file',log1:'LOG1 File',lnk:'Shortcut',xlsx:'Excel Worksheet','automaticdestinations-ms':'AUTOMATICD… File','customdestinations-ms':'CUSTOMDES… File'};
  const noExt = {SYSTEM:'File',SOFTWARE:'File',SAM:'File',SECURITY:'File',DEFAULT:'File',History:'File',hosts:'File','$MFT':'File','$UsnJrnl':'File'};
  const kind = kinds[ext] || noExt[name] || (ext?ext.toUpperCase()+' File':'File');
  return {date, kind, size: kb.toLocaleString('en-US')+' KB'};
}
function iconFor(node){
  if (node.dir) return {n:'folder', c:'#8C9196'};
  const name = node.name;
  const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
  if (ext === 'plist') return {n:'code', c:'#9AA0A6'};
  if (ext === 'tracev3') return {n:'scroll', c:'#9AA0A6'};
  if (ext === 'dmg') return {n:'disk', c:'#9AA0A6'};
  if (ext === 'rtf' || ext === 'pages' || ext === 'docx') return {n:'fileText', c:'#9AA0A6'};
  if (ext === 'pf') return {n:'bolt', c:'#8C9196'};
  if (ext === 'evtx') return {n:'scroll', c:'#9AA0A6'};
  if (ext === 'hve' || ext === 'dat' || ext === 'bcf' || ext === 'db' || ['SYSTEM','SOFTWARE','SAM','SECURITY','DEFAULT'].indexOf(name)>=0) return {n:'database', c:'#9AA0A6'};
  if (ext === 'txt' || ext === 'log') return {n:'fileText', c:'#7C8A94'};
  if (ext === 'exe' || ext === 'app') return {n:'app', c:'#9AA0A6'};
  if (ext === 'lnk') return {n:'app', c:'#7C8A94'};
  if (ext === 'automaticdestinations-ms' || ext === 'customdestinations-ms') return {n:'database', c:'#9AA0A6'};
  if (ext === 'zip') return {n:'zip', c:'#9AA0A6'};
  return {n:'file', c:'#7C8A94'};
}

/* ------------------------- path helpers / matching ------------------------ */
function relToDisplay(rel){ return S.os === 'mac' ? '/'+rel : 'C:\\'+rel.replace(/\//g,'\\'); }
function segsToRel(segs){ return segs.join('/'); }
function canon(rel){ return rel.toLowerCase().replace(/^users\/[^/]+/, 'users/*'); }
function parentRel(rel){ const i = rel.lastIndexOf('/'); return i < 0 ? '' : rel.slice(0, i); }

function matches(a, selRel){
  if (!a) return false;
  const w = a.rel, g = selRel;
  if (a.prefix) return g === w || g.indexOf(w + '/') === 0;
  /* folderOk artifacts also accept the folder that holds the file */
  return g === w || (a.folderOk && g === parentRel(w));
}
function normTyped(input){
  let s = String(input||'').trim().toLowerCase().replace(/"/g,'');
  s = s.replace(/\\/g,'/');
  if (S.os === 'mac'){
    s = s.replace(/^~/, 'users/*').replace(/^\$home/, 'users/*');
    s = s.replace(/^\//,'');
  } else {
    s = s.replace('%systemroot%','windows').replace('%windir%','windows').replace(/^%userprofile%/,'users/*');
    s = s.replace(/^c:\//,'').replace(/^c:/,'').replace(/^\//,'');
  }
  s = s.replace(/\/+/g,'/').replace(/\/$/,'');
  s = s.replace(/^users\/[^/]+/, 'users/*');
  return s;
}
function typedMatches(a, typed){
  const want = canon(a.rel), got = normTyped(typed);
  if (a.prefix) return got === want || got.indexOf(want + '/') === 0;
  return got === want || (a.folderOk && got === canon(parentRel(a.rel)));
}

/* ------------------------------- navigation ------------------------------- */
function setState(patch){ Object.assign(S, patch); render(); }
function navigate(segs){
  const exp = Object.assign({}, S.expanded);
  segs.forEach((s,i) => { exp[segs.slice(0,i+1).join('/')] = true; });
  setState({cwd: segs, selected:null, history: S.history.concat([S.cwd]), expanded: exp});
}
function regNavigate(segs){
  const exp = Object.assign({}, S.rExpanded);
  segs.forEach((s,i) => { exp[segs.slice(0,i+1).join('/')] = true; });
  setState({rCwd: segs, rSelected:null, rHistory: S.rHistory.concat([S.rCwd]), rExpanded: exp});
}
function regExpandTo(key){
  const segs = key.split('/');
  const exp = Object.assign({}, S.rExpanded);
  segs.forEach((s,i) => { exp[segs.slice(0,i+1).join('/')] = true; });
  return {rCwd: segs, rSelected:null, rExpanded: exp, rHistory: []};
}
function buildQueue(){
  let ids = (isMulti() ? SCEN() : catArt()).map(x => x.id);
  ids = ids.map(v => [Math.random(), v]).sort((a,b) => a[0]-b[0]).map(p => p[1]);
  if (!ids.length) return [];
  const out = [];
  while (out.length < S.roundLen) out.push(ids[out.length % ids.length]);
  return out.slice(0, S.roundLen);
}
function cur(){
  const id = S.queue[S.idx];
  return isMulti() ? SCEN().find(s => s.id === id) : art(id);
}

/* ------------------------------- grading ---------------------------------- */
function expandTo(rel, prefix){
  const segs = rel.split('/');
  const parent = prefix ? segs : segs.slice(0,-1);
  const exp = Object.assign({}, S.expanded);
  parent.forEach((s,i) => { exp[parent.slice(0,i+1).join('/')] = true; });
  return {cwd: prefix ? segs : parent, selected: rel, expanded: exp};
}
function gradeSingle(ok){
  const a = cur();
  const patch = {
    score: S.score + (ok ? (isExpert() ? 15 : (S.hintShown ? 5 : 10)) : 0),
    fb: {ok, rows:[a.id], why:''},
    log: S.log.concat([{ok, name:a.name, path:relToDisplay(a.rel), why: ok?'':whyOf(a.id)}]),
  };
  if (isExpert()) Object.assign(patch, expandTo(a.rel, a.prefix));
  setState(patch);
}
function closeScenario(ok, found){
  const q = cur();
  const gained = ok ? Math.max(0, q.need*(isExpert()?15:10) - S.wrong*3) : 0;
  const patch = {
    score: S.score + gained,
    fb: {ok, rows:q.pool, found, why:q.why},
    log: S.log.concat([{ok, name:q.name, path: found.map(id => art(id).name).join('  +  ') || 'nothing logged', why: ok?'':q.why}]),
  };
  if (isExpert() && found.length){
    const a = art(found[found.length-1]);
    Object.assign(patch, expandTo(a.rel, a.prefix));
  }
  setState(patch);
}
function gradeRegDone(ok){
  const a = cur(), r = REG[a.id];
  setState({
    score: S.score + (ok ? 15 : 0),
    fb: {ok, reg:true, rows:[a.id], why:''},
    log: S.log.concat([{ok, name:a.name, path: relToDisplay(a.rel)+'  →  '+regDisplay(a.id), why: ok?'':(whyOf(a.id)+' '+r.note)}]),
  });
}
function enterMatch(){ setState({matching:true, matchPicks: buildMatchPicks(cur().id), matchWrong:0, flash:null, selected:null, rSelected:null}); }
function chooseMatch(idx){
  if (!S.matching || !S.matchPicks) return;
  const q = cur();
  const correct = idx === S.matchPicks.correct;   /* one guess only — a wrong pick reveals the answer */
  S.matching = false; S.matchPicks = null;
  if (regActive() && regCapable(q.id)) gradeRegDone(correct); else gradeSingle(correct);
}
function confirm(){
  const q = cur();
  const multi = isMulti(), expert = isExpert(), need = q.need || 1;
  if (S.matching) return; /* the match phase is resolved by choosing a card */
  /* registry-search: phase 1 = open the right hive file, phase 2 = find the key */
  if (regActive() && regCapable(q.id)){
    if (S.phase === 1){
      if (!S.selected) return;
      if (matches(q, S.selected))
        setState({phase:2, rCwd:[], rHistory:[], rExpanded:{}, rSelected:null, selected:null,
          flash:{ok:true, text: q.rel.split('/').pop()+' opened. Now navigate to the key.'}});
      else
        setState({wrong:S.wrong+1, selected:null, flash:{ok:false, text:'That is not the hive that holds it. Open the right hive file.'}});
    } else {
      if (!S.rSelected) return;
      if (regMatches(q.id, S.rSelected)){ if (matchActive()) enterMatch(); else gradeRegDone(true); }
      else setState({flash:{ok:false, text:'Not the right key. Keep navigating the hive.'}});
    }
    return;
  }
  if (expert && multi){
    if (!q || !S.typed.trim()) return;
    const hit = q.pool.filter(id => S.found.indexOf(id)<0).find(id => typedMatches(art(id), S.typed));
    if (!hit){
      const limit = need <= 2 ? 1 : 2, w = S.wrong + 1;
      if (w > limit){ S.wrong = w; closeScenario(false, S.found); return; }
      const rem = limit - w;
      const msg = rem > 0 ? (rem+' wrong '+(rem===1?'pick':'picks')+' left.') : 'One more wrong pick reveals the answer.';
      setState({wrong:w, typed:'', flash:{ok:false, text:'That path is not part of this answer. '+msg}});
      return;
    }
    const found = S.found.concat([hit]);
    if (found.length >= need){ Object.assign(S,{found, typed:'', flash:null}); closeScenario(true, found); return; }
    setState({found, typed:'', flash:{ok:true, text: art(hit).name + ' logged. ' + (need-found.length) + ' to go.'}});
    return;
  }
  if (expert){ if (q && S.typed.trim()) gradeSingle(typedMatches(q, S.typed)); return; }
  if (!S.selected || !q) return;
  if (!multi){
    if (matches(q, S.selected)){ if (matchActive()) enterMatch(); else gradeSingle(true); }
    else gradeSingle(false);
    return;
  }
  const hit = q.pool.filter(id => S.found.indexOf(id)<0).find(id => matches(art(id), S.selected));
  if (!hit){
    const limit = need <= 2 ? 1 : 2, w = S.wrong + 1;
    if (w > limit){ S.wrong = w; closeScenario(false, S.found); return; }
    const rem = limit - w;
    const msg = rem > 0 ? (rem+' wrong '+(rem===1?'pick':'picks')+' left.') : 'One more wrong pick reveals the answer.';
    setState({wrong:w, selected:null, flash:{ok:false, text:'That path is not part of this answer. '+msg}});
    return;
  }
  const found = S.found.concat([hit]);
  if (found.length >= need){ Object.assign(S,{found, flash:null}); closeScenario(true, found); return; }
  setState({found, selected:null, flash:{ok:true, text: art(hit).name + ' logged. ' + (need-found.length) + ' to go.'}});
}

    + '</div></div>';

function label(t){ return '<div class="mono" style="margin-top:30px;font-size:12px;letter-spacing:.6px;color:var(--grey)">'+E(t)+'</div>'; }

/* shared feedback rows (desktop + mobile) */
/* uniform artifact explanation: intro + evidence value (from the structured DESC) */
function whyOf(id){ const d = DESC[id]; return d ? (d.intro + ' ' + d.dfir) : ((art(id)||{}).why || ''); }

function fbRows(fb, multi){
  let rows = '';
  (fb.rows||[]).forEach(id => { const a = art(id);
    const got = fb.found ? fb.found.indexOf(id)>=0 : fb.ok;
    const ic = got ? {n:'check',c:'#0E7A4A'} : (multi?{n:'dashed',c:'#777'}:{n:'x',c:S.red});
    rows += '<div style="display:flex;gap:10px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)">'
      + icon(ic.n, ic.c, 17)
      + '<div style="min-width:0"><div style="font-size:18px;font-weight:600">'+E(a.name)+'</div>'
      + '<div class="mono revpath link" data-act="reveal" data-rel="'+A(a.rel)+'" data-prefix="'+(a.prefix?'1':'')+'" title="open this location" style="font-size:12px;color:var(--green);word-break:break-all">'+E(relToDisplay(a.rel))+' ↗</div>'
      + (fb.reg && REG[id] ? '<div class="mono revpath link" data-act="rreveal" data-key="'+A(REG[id].key)+'" title="open this key" style="font-size:12px;color:var(--green);word-break:break-all;margin-top:2px">'+E(regDisplay(id))+' ↗</div>' : '')
      + '<div style="font-size:15px;line-height:21px;color:#444;margin-top:6px;overflow-wrap:anywhere">'+E(whyOf(id))+'</div>'
      + (fb.reg && REG[id] ? '<div style="font-size:14px;line-height:20px;color:#666;margin-top:6px;overflow-wrap:anywhere">'+E(REG[id].note)+'</div>' : '')
      + '<div class="mono" style="font-size:13px;color:#555;margin-top:5px;overflow-wrap:anywhere">Parse with '+E(a.tool)+'</div>'
      + '<div style="margin-top:8px"><span class="link" data-act="more" data-id="'+A(id)+'" style="display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--green)">'+icon('target','#0E7A4A',14)+'Tell me more</span></div></div></div>';
  });
  return rows;
}

/* ------ game screen ------ */
function gameScreen(){
  if (isMobile()) return mobileGame();
  const c = cfg(), multi = isMulti(), expert = isExpert();
  const q = cur();
  if (!q) return '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted)">No questions in this pool.</div>';
  const need = multi ? q.need : 1;
  const metaWide = S.vw >= 1180;
  const twoPhase = regActive() && regCapable(q.id);

  /* left: task panel */
  const progress = S.queue.length ? Math.round(S.idx / S.queue.length * 100) : 0;
  let panel = '<div style="background:#fff;border-radius:10px;box-shadow:0 0 4px rgba(0,0,0,.15);padding:24px;display:flex;flex-direction:column;gap:18px;align-self:start">';
  panel += '<div><div style="display:flex;align-items:baseline;justify-content:space-between">'
    + '<div class="mono" style="font-size:12px;color:var(--grey)">'+(multi?'Case ':'Artifact ')+(S.idx+1)+' of '+S.queue.length+'</div>'
    + '<div class="mono" style="font-size:13px;color:#555">'+S.score+' pts</div></div>'
    + '<div style="height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden"><div style="height:4px;background:var(--green);width:'+progress+'%"></div></div></div>';

  panel += '<div><div class="mono" style="font-size:12px;color:var(--green)">'+(multi?'Prove':(expert?'Recall':(S.matching?'Match':'Locate')))+'</div>'
    + '<div style="font-size:26px;line-height:33px;font-weight:600;margin-top:4px;color:var(--ink)">'+E(q.name)+'</div>'
    + (S.matching ? '' : '<div style="font-size:17px;line-height:24px;color:var(--muted);margin-top:6px">'+E(q.sub)+'</div>')+'</div>';

  /* two-phase stepper: find the hive, then the key */
  if (twoPhase && !S.fb){
    const step = (n,txt) => {
      const active = S.phase === n, done = S.phase > n;
      const bg = done ? 'var(--green)' : (active ? 'var(--green)' : '#fff');
      const bd = (done||active) ? 'var(--green)' : '#D9D9D9';
      const fg = (done||active) ? '#fff' : '#B8B8B8';
      return '<div style="display:flex;align-items:center;gap:8px;flex:1">'
        + '<div style="flex-shrink:0;width:22px;height:22px;border-radius:50%;background:'+bg+';border:1px solid '+bd+';color:'+fg+';font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center">'+(done?'✓':n)+'</div>'
        + '<div style="font-size:13px;line-height:16px;color:'+(active?'var(--ink)':'#999')+';font-weight:'+(active?'600':'400')+'">'+txt+'</div></div>';
    };
    panel += '<div class="mono" style="font-size:12px;color:var(--green);margin-top:-6px">registry search</div>'
      + '<div style="display:flex;gap:10px;align-items:center">'+step(1,'Open the hive')+step(2,'Find the key')+'</div>';
  }

  /* evidence slots */
  if (multi){
    let slots = '';
    S.found.forEach(id => { const a = art(id);
      slots += '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:5px;background:var(--panel);border:1px solid #DDE1E4">'
        + icon('check','#0E7A4A',16)
        + '<div style="min-width:0"><div style="font-size:17px;font-weight:600;color:#444">'+E(a.name)+'</div>'
        + '<div class="mono" style="font-size:12px;color:#777;word-break:break-all">'+E(relToDisplay(a.rel))+'</div></div></div>';
    });
    for (let i=S.found.length;i<need;i++){
      slots += '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:5px;background:#fff;border:1px dashed #D9D9D9">'
        + icon('dashed','#CACACA',16)
        + '<div><div style="font-size:17px;font-weight:600;color:#B8B8B8">Evidence '+(i+1)+'</div>'
        + '<div class="mono" style="font-size:12px;color:#777">'+(expert?'type a path and log it':'select a path and log it')+'</div></div></div>';
    }
    panel += '<div style="border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px">'
      + '<div style="display:flex;align-items:baseline;justify-content:space-between">'
      + '<div class="mono" style="font-size:12px;color:var(--grey)">logged evidence</div>'
      + '<div class="mono" style="font-size:14px;color:var(--green)">'+S.found.length+' / '+need+'</div></div>'+slots+'</div>';
  }

  /* hint */
  if (S.hintShown && !multi && !expert && !twoPhase){
    const base = q.rel.split('/')[0], leaf = q.rel.split('/').pop();
    const hintTxt = HINTS[q.id] || ('Look for "'+leaf+'" somewhere under '+base+'.');
    panel += '<div style="background:var(--panel);border-left:2px solid var(--green);border-radius:0 5px 5px 0;padding:11px 14px;font-size:16px;line-height:22px;color:#555">'+E(hintTxt)+'</div>';
  }
  /* flash */
  if (S.flash && !S.fb){
    const col = S.flash.ok ? '#155537' : S.red;
    const fbg = S.flash.ok ? '#E8F3EC' : '#FBEAEC';
    panel += '<div style="border-radius:6px;padding:11px 14px;font-size:16px;background:'+fbg+';border-left:4px solid '+col+';color:'+col+'">'+E(S.flash.text)+'</div>';
  }

  if (S.matching){
    panel += '<div style="border:1px dashed #D9D9D9;border-radius:5px;padding:12px 14px;font-size:16px;line-height:23px;color:#555">Located it. Now drag <b>'+E(q.name)+'</b> onto the description of what it proves — or tap the right one. <b>One guess</b> — a wrong pick reveals the answer.</div>'
      + '<div style="display:flex;align-items:center;gap:12px"><span class="link" data-act="skip" style="font-size:16px;color:#A6A6A6;text-decoration:underline">Give up</span></div>';
  } else if (!S.fb){
    /* controls */
    let ctrl = '<div style="display:flex;flex-direction:column;gap:14px">';
    if (expert){
      ctrl += '<div><div class="mono" style="font-size:12px;color:#A6A6A6">type the full path</div>'
        + '<input id="typed" type="text" value="'+A(S.typed)+'" placeholder="'+A(c.placeholder)+'" spellcheck="false" autocomplete="off" '
        + 'style="width:100%;margin-top:6px;height:40px;border:1px solid #CACACA;border-radius:5px;padding:0 12px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#fff;outline:none">'
        + '<div class="mono" style="font-size:12px;color:#A6A6A6;margin-top:6px">'+E(c.note)+'</div></div>';
    } else if (twoPhase && S.phase === 2){
      const sel = S.rSelected ? regDisplay(q.id, S.rSelected) : 'no key selected yet';
      ctrl += '<div style="border:1px dashed #D9D9D9;border-radius:5px;padding:12px 14px">'
        + '<div class="mono" style="font-size:12px;color:#A6A6A6">selected key</div>'
        + '<div class="mono" style="font-size:14px;color:'+(S.rSelected?'var(--green)':'#B8B8B8')+';margin-top:4px;word-break:break-all">'+E(sel)+'</div></div>';
    } else {
      const sel = S.selected ? relToDisplay(S.selected) : 'nothing selected yet';
      ctrl += '<div style="border:1px dashed #D9D9D9;border-radius:5px;padding:12px 14px">'
        + '<div class="mono" style="font-size:12px;color:#A6A6A6">'+(twoPhase?'selected hive':'selected')+'</div>'
        + '<div class="mono" style="font-size:14px;color:'+(S.selected?'var(--green)':'#B8B8B8')+';margin-top:4px;word-break:break-all">'+E(sel)+'</div></div>';
    }
    /* expert button stays enabled: typing doesn't re-render, so we must not
       freeze it disabled — confirm() itself ignores an empty path */
    const ready = twoPhase ? (S.phase===1 ? !!S.selected : !!S.rSelected) : (expert ? true : !!S.selected);
    const confLabel = twoPhase ? (S.phase===1?'Open hive':'Confirm key') : (multi ? (expert?'Log path':'Log evidence') : (expert?'Submit path':'Confirm'));
    ctrl += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
      + '<button class="btn" data-act="confirm"'+(ready?'':' aria-disabled="true"')+'>'+confLabel+'</button>';
    if (!multi && !expert && !twoPhase && !S.hintShown) ctrl += '<button class="btn out" data-act="hint">Hint</button>';
    ctrl += '<span class="link" data-act="skip" style="font-size:16px;color:#A6A6A6;text-decoration:underline">Give up</span>';
    ctrl += '</div></div>';
    panel += ctrl;
  } else {
    /* feedback */
    const fb = S.fb, col = fb.ok ? '#155537' : S.red;
    const title = fb.ok ? (multi?'Case closed':'Correct') : (multi?'Revealed':'Not this one');
    const lastQ = S.idx >= S.queue.length-1;
    const bg = fb.ok ? '#E8F3EC' : '#FBEAEC';
    panel += '<div style="border-radius:8px;padding:16px 18px;background:'+bg+';border-left:4px solid '+col+'">'
      + (multi ? '<div style="display:flex;align-items:center;gap:10px">'+icon(fb.ok?'check':'x', col, 22)+'<div style="font-size:23px;font-weight:600;color:'+col+'">'+E(title)+'</div></div>' : '')
      + (fb.why?'<div style="font-size:16px;line-height:23px;color:#444;margin-top:'+(multi?'10':'2')+'px;overflow-wrap:anywhere">'+E(fb.why)+'</div>':'')
      + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:'+(multi?'14':'2')+'px">'+fbRows(fb, multi)+'</div>'
      + '<button class="btn'+(fb.ok?'':' danger')+'" data-act="next" style="margin-top:16px">'+(lastQ?'See results':(multi?'Next case':'Next artifact'))+'</button></div>';
  }
  panel += '</div>';

  /* right: explorer, opened hive, or the DFIR-match challenge */
  const win = S.matching ? matchPanel(q) : ((twoPhase && S.phase === 2) ? regEditor(q) : explorer(q));

  return '<div style="flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:20px;padding:20px 28px 28px">'+panel+win+'</div>'
    + (S.more ? moreModal() : '');
}

/* "tell me more" briefing dialog */
function moreModal(){
  const a = art(S.more); if (!a) return '';
  const d = DESC[S.more] || {intro:(a.why||''), os:'', dfir:''};
  const catName = (CATS.find(c => c.id === a.cat)||{}).label || '';
  const regLine = REG[S.more] ? '<div class="mono revpath link" data-act="rreveal" data-key="'+A(REG[S.more].key)+'" style="font-size:12px;color:var(--green);margin-top:3px;word-break:break-all">'+E(regDisplay(S.more))+' ↗</div>' : '';
  const osLabel = S.os === 'mac' ? 'What macOS uses it for' : 'What Windows uses it for';
  const section = (label, text) => text ? '<div style="margin-top:16px"><div class="mono" style="font-size:11px;letter-spacing:.5px;color:var(--grey)">'+E(label)+'</div>'
    + '<div style="font-size:15px;line-height:22px;color:#3d3d3d;margin-top:4px;overflow-wrap:anywhere">'+E(text)+'</div></div>' : '';
  return '<div data-act="moreClose" style="position:fixed;inset:0;z-index:60;background:rgba(20,24,28,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px">'
    + '<div data-act="stop" style="width:100%;max-width:560px;max-height:86vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:26px 28px">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">'
      + '<div style="min-width:0"><div class="mono" style="font-size:12px;color:var(--green)">// artifact briefing'+(catName?' · '+E(catName.toLowerCase()):'')+'</div>'
      + '<div style="font-size:26px;line-height:31px;font-weight:600;color:var(--ink);margin-top:5px">'+E(a.name)+'</div></div>'
      + '<div class="link" data-act="moreClose" title="close" style="flex-shrink:0;font-size:26px;color:#B8B8B8;line-height:.8;padding:2px 4px">&times;</div></div>'
    + '<div class="mono revpath link" data-act="reveal" data-rel="'+A(a.rel)+'" data-prefix="'+(a.prefix?'1':'')+'" style="font-size:12px;color:var(--green);margin-top:12px;word-break:break-all">'+E(relToDisplay(a.rel))+' ↗</div>'+regLine
    + section('What it is', d.intro)
    + section(osLabel, d.os)
    + section('As DFIR evidence', d.dfir)
    + '<div class="mono" style="font-size:13px;color:#555;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);overflow-wrap:anywhere">Parse with '+E(a.tool)+'</div>'
    + '<div style="margin-top:16px;text-align:right"><button class="btn sm" data-act="moreClose">Got it</button></div>'
    + '</div></div>';
}

/* DFIR-match: token + three description cards (shared by desktop & mobile) */
function matchCards(q){
  const picks = S.matchPicks || {options:[]};
  const token = '<div id="match-token" draggable="true" style="display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:10px;background:#2E3338;color:#fff;font-size:17px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.22)">'+icon('target','#fff',18)+E(q.name)+'</div>';
  let cards = '';
  picks.options.forEach((o,i) => {
    cards += '<div class="link matchcard" data-act="match" data-idx="'+i+'" style="border:1px solid #D9D9D9;border-radius:10px;background:#fff;padding:13px 15px;font-size:15px;line-height:22px;color:#444">'
      + '<div class="mono" style="font-size:11px;color:#A6A6A6;margin-bottom:6px">option '+(i+1)+'</div>'+E(o.text)+'</div>';
  });
  return {token, cards};
}
function matchPanel(q){
  const {token, cards} = matchCards(q);
  return '<div style="min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden">'
    + '<div style="flex-shrink:0;padding:16px 18px;border-bottom:1px solid var(--line)"><div class="mono" style="font-size:12px;color:var(--green)">// match the evidence</div>'
    + '<div style="font-size:17px;color:#555;margin-top:6px">Which description fits this artifact? Drag the chip onto it, or tap one — you get one guess.</div></div>'
    + '<div style="flex:1;min-height:420px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px">'
    + '<div style="display:flex;justify-content:center;padding:4px 0 8px">'+token+'</div>'
    + cards + '</div></div>';
}

/* ============================ mobile game (< 760px) ======================= */
function mobileGame(){
  const q = cur();
  if (!q) return '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center">No questions in this pool.</div>';
  const multi = isMulti(), expert = isExpert(), need = multi ? q.need : 1;
  const twoPhase = regActive() && regCapable(q.id);

  /* feedback takes over the screen (unless peeking at a revealed path) */
  if (S.fb && !S.peek){
    const fb = S.fb, col = fb.ok ? '#155537' : S.red, bg = fb.ok ? '#E8F3EC' : '#FBEAEC';
    const title = fb.ok ? (multi?'Case closed':'Correct') : (multi?'Revealed':'Not this one');
    const lastQ = S.idx >= S.queue.length-1;
    const body = '<div style="flex:1;min-height:0;overflow-y:auto;padding:16px">'
      + '<div style="border-radius:8px;padding:16px 18px;background:'+bg+';border-left:4px solid '+col+'">'
      + (multi ? '<div style="display:flex;align-items:center;gap:10px">'+icon(fb.ok?'check':'x', col, 22)+'<div style="font-size:22px;font-weight:600;color:'+col+'">'+E(title)+'</div></div>' : '')
      + (fb.why?'<div style="font-size:15px;line-height:22px;color:#444;margin-top:'+(multi?'10':'2')+'px;overflow-wrap:anywhere">'+E(fb.why)+'</div>':'')
      + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:'+(multi?'14':'2')+'px">'+fbRows(fb, multi)+'</div></div></div>'
      + '<div style="flex-shrink:0;padding:12px 16px;border-top:1px solid var(--line);background:#fff">'
      + '<button class="btn'+(fb.ok?'':' danger')+'" data-act="next" style="width:100%">'+(lastQ?'See results':(multi?'Next case':'Next artifact'))+'</button></div>';
    return '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'+body+'</div>'+(S.more?moreModal():'');
  }

  /* DFIR-match phase takes over the screen */
  if (S.matching){
    const mc = matchCards(q);
    const flash = (S.flash && !S.fb) ? '<div style="flex-shrink:0;padding:9px 14px;font-size:14px;background:#FBEAEC;color:'+S.red+'">'+E(S.flash.text)+'</div>' : '';
    const top = '<div style="flex-shrink:0;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line)"><div class="mono" style="font-size:11px;color:var(--green)">Match</div>'
      + '<div style="font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+E(q.name)+'</div></div>';
    const body = '<div style="flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">'
      + '<div style="font-size:14px;color:#555">Which description fits it? Tap the right one — you get one guess.</div>'
      + '<div style="display:flex;justify-content:center;padding:2px 0 4px">'+mc.token+'</div>'
      + mc.cards + '</div>'
      + '<div style="flex-shrink:0;padding:10px 14px;border-top:1px solid var(--line);background:#fff;text-align:center"><span class="link" data-act="skip" style="font-size:15px;color:#A6A6A6;text-decoration:underline">Give up</span></div>';
    return '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'+top+flash+body+'</div>'+(S.more?moreModal():'');
  }

  /* top bar: objective (tap for details), or "back to result" while peeking */
  let topBar;
  if (S.fb && S.peek){
    topBar = '<div class="link" data-act="unpeek" style="flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);color:var(--green);font-size:15px;font-weight:600">'+icon('arrowLeft','#0E7A4A',18)+'Back to result</div>';
  } else {
    const prog = multi ? ('  '+S.found.length+'/'+need) : (twoPhase ? ('  step '+S.phase+'/2') : '');
    const kicker = (multi?'Prove':(expert?'Recall':'Locate'))+prog;
    topBar = '<div class="link" data-act="sheet" style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line)">'
      + '<div style="min-width:0;flex:1"><div class="mono" style="font-size:11px;color:var(--green)">'+E(kicker)+'</div>'
      + '<div style="font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+E(q.name)+'</div></div>'
      + '<div style="flex-shrink:0;display:flex;align-items:center;gap:5px;color:var(--green);font-size:13px;font-weight:600">task '+icon('caretDown','#0E7A4A',13)+'</div></div>';
  }

  /* flash banner */
  let flashBar = '';
  if (S.flash && !S.fb){ const ok = S.flash.ok;
    flashBar = '<div style="flex-shrink:0;padding:9px 14px;font-size:14px;background:'+(ok?'#E8F3EC':'#FBEAEC')+';color:'+(ok?'#155537':S.red)+'">'+E(S.flash.text)+'</div>';
  }

  const main = (S.fb && S.peek)
    ? ((twoPhase && S.phase===2) ? mobileReg(q) : mobileExplorer(q))
    : (expert ? mobileExpert(q) : ((twoPhase && S.phase===2) ? mobileReg(q) : mobileExplorer(q)));

  const action = (S.fb && S.peek) ? '' : mobileAction(q, multi, expert, twoPhase, need);

  return '<div style="flex:1;display:flex;flex-direction:column;min-height:0">'
    + topBar + flashBar
    + '<div style="flex:1;min-height:0;display:flex;flex-direction:column">'+main+'</div>'
    + action
    + '</div>'
    + (S.sheet ? mobileSheet(q, multi, expert, twoPhase, need) : '')
    + (S.more ? moreModal() : '');
}

/* mobile file explorer: no side tree, big rows, folder body opens, select button picks */
function mobileExplorer(q){
  const c = cfg();
  const node = nodeAt(S.cwd) || tree();
  const kids = sortKids(node);
  const path = S.cwd.length ? c.rootShort+'  '+S.cwd.join('  ›  ') : c.rootLabel;

/* mobile task sheet: objective, progress, evidence, hint, give up */

  const progress = S.queue.length ? Math.round(S.idx / S.queue.length * 100) : 0;
  let slots = '';
  if (multi){
    S.found.forEach(id => { const a = art(id);
      slots += '<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:5px;background:var(--panel);border:1px solid #DDE1E4;margin-top:8px">'

    });
    for (let i=S.found.length;i<need;i++){

    }
  }

      hintBlock = '<div style="background:var(--panel);border-left:3px solid var(--green);border-radius:0 6px 6px 0;padding:11px 14px;font-size:15px;line-height:21px;color:#555;margin-top:14px">'+E(HINTS[q.id]||('Look for "'+leaf+'" under '+base+'.'))+'</div>';

    + '<div style="height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden"><div style="height:4px;background:var(--green);width:'+progress+'%"></div></div>'
    + '<div class="mono" style="font-size:12px;color:var(--green);margin-top:16px">'+(multi?'Prove':(expert?'Recall':'Locate'))+(twoPhase?' · registry search':'')+'</div>'
    + '<div style="font-size:24px;line-height:30px;font-weight:600;color:var(--ink);margin-top:3px">'+E(q.name)+'</div>'

    + (twoPhase?'<div style="font-size:14px;color:#666;margin-top:10px">Step '+S.phase+' of 2 — '+(S.phase===1?'find and open the hive file in the explorer.':'navigate the opened hive to the key.')+'</div>':'')
    + (multi?'<div class="mono" style="font-size:12px;color:var(--grey);margin-top:16px">logged evidence · '+S.found.length+'/'+need+'</div>'+slots:'')

    + '<div style="display:flex;gap:14px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">'

      + icon('lock','#8A9095',26)
      + '<div class="mono" style="font-size:13px;color:#555">'+E(c.shell.toLowerCase())+' locked</div>'

/* the opened hive — a regedit-style key tree (phase 2 of registry search) */
function regEditor(q){
  const root = REG[q.id].root;

  const cwd = S.rCwd;

    + '<div style="display:flex;align-items:center;height:40px;color:#444">'
    + '<div style="width:44px;height:40px;display:flex;align-items:center;justify-content:center">&minus;</div>'

    + '<div style="width:44px;height:40px;display:flex;align-items:center;justify-content:center">&times;</div></div></div>';

  /* address bar: Computer\<root>\<key path> in regedit style */
